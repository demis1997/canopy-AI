<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Canopy</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <h1>Canopy</h1>
    <p class="muted">Human-in-the-loop. This extension never sends messages or reads platform cookies.</p>
    <label>Session token from Canopy dashboard</label>
    <input id="token" type="password" placeholder="Extension token" />
    <button id="save-token">Save token</button>
    <button id="read">Read visible thread</button>
    <pre id="thread"></pre>
    <textarea id="draft" placeholder="Edited suggestion"></textarea>
    <button id="insert">Insert into compose box</button>
    <p id="status" class="muted"></p>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
