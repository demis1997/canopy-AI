services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: canopy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: canopy
      POSTGRES_PASSWORD: canopy
      POSTGRES_DB: canopy
    ports:
      - "5432:5432"
    volumes:
      - canopy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canopy -d canopy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: canopy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - canopy_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  canopy_pg_data:
  canopy_redis_data:
